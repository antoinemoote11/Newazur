name: Build AzurBot Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest version
        shell: pwsh
        run: |
          $zips = Get-ChildItem -Path . -Filter "Newazur-code-v*.zip" -File |
            Where-Object { $_.Name -match '^Newazur-code-v(\d+)\.zip$' } |
            Sort-Object { [int]([regex]::Match($_.Name, '\d+').Value) } -Descending

          if (-not $zips) {
            Write-Error "Aucune archive Newazur-code-vN.zip trouvée."
            exit 1
          }

          $zip = $zips[0]
          Write-Host "Version sélectionnée : $($zip.Name)"

          Expand-Archive -Path $zip.FullName -DestinationPath source -Force

          if (-not (Test-Path "source/src/AzurBot.csproj")) {
            Write-Error "Projet source/src/AzurBot.csproj introuvable."
            exit 1
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile AzurBot
        shell: pwsh
        run: dotnet publish "source/src/AzurBot.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload AzurBot
        uses: actions/upload-artifact@v4
        with:
          name: AzurBot-Windows
          path: publish/
